name: Build Lumio Store APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack Lumio Store project
        run: |
          rm -rf lumio
          mkdir lumio
          unzip LumioStore_White_v3_GitHub.zip -d lumio
          echo "Project files:"
          find lumio -maxdepth 3 -type f

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Lumio Store APK
        run: |
          cd lumio/LumioStore
          gradle :app:assembleDebug

      - name: Check APK
        run: |
          ls -lh lumio/LumioStore/app/build/outputs/apk/debug/
          test -f lumio/LumioStore/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Lumio Store APK
        uses: actions/upload-artifact@v4
        with:
          name: LumioStore-White-v2-APK
          path: lumio/LumioStore/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
